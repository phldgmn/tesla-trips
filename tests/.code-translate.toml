[code_translate]
source_roots = ["frontend", "src", "scripts", "tests"]
exclude = ["node_modules", "dist", "build", "coverage", ".next", ".venv", "venv", ".git", ".github", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".run", ".superpowers"]
state_dir = ".code-translate"
# model = "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"
temperature = 0
confidence_threshold = 0.90
batch_size = 32
