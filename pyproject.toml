[project]
name = "tripplanner"
version = "0.1.0"
description = "Hochgradig personalisierter Reiseplaner für Tesla Model 3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.26.0",
    "rasterio>=1.3.10",
    "ortools>=9.10.0",
    "networkx>=3.3.0",
    "fastapi>=0.115.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "xmlschema>=3.3.0",
    "shapely>=2.0.0",
    "geographiclib>=2.0",
    "polyline>=2.0.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.scripts]
ttp = "tripplanner.trip_input.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripplanner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
extend-select = ["D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "PLR0913", "PLR0917"]
"src/tripplanner/construction/*" = ["D105", "D107", "PLR0912", "PLR0915", "PLR2004"]
"src/tripplanner/energy/*" = ["PLR0913", "PLR0917", "PLR0915", "E501"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests (slow, gegen echte Dienste)",
]
addopts = "-v --tb=short --cov=src/tripplanner --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/tripplanner"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]