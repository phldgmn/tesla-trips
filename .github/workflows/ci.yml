name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise-managed tools (Python, uv, hk, shellcheck, shfmt, …)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: uv sync

      - name: Run linters (ruff check, ruff format, mypy)
        run: uv run hk check --all

      - name: Run unit tests with coverage
        run: uv run pytest -m "not integration" --cov=src/tripplanner --cov-report=term-missing --cov-fail-under=85

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise-managed tools (Python, uv)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: uv sync

      # GitHub Actions `services:`-Container koennen keine zusaetzlichen
      # CLI-Argumente (z. B. `--url`) an den Entrypoint uebergeben. Das
      # `israelhikingmap/graphhopper`-Image bringt aber KEINEN vorgebauten
      # Graphen mit - ohne `--url`/OSM-Quelldatei startet der Server nicht
      # (siehe README.md, docker-compose.yml). Daher hier als expliziter
      # `docker run`-Schritt mit einem bewusst kleinen Berlin-Demo-Extrakt
      # (schneller CI-Import) statt des lokalen DE+DK+SE-Standard-Extrakts
      # aus `docker-compose.yml`/`scripts/prepare_osm_extract.sh` (mehrere
      # GB, fuer CI ungeeignet).
      - name: Start GraphHopper (Berlin-Extrakt)
        run: |
          docker run -d --name graphhopper -p 8989:8989 \
            israelhikingmap/graphhopper:11.0 \
            --url https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf \
            --host 0.0.0.0
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:8989/route?point=52.52,13.40&point=52.53,13.41&profile=car" >/dev/null; then
              echo "GraphHopper ist bereit."
              exit 0
            fi
            sleep 5
          done
          echo "GraphHopper wurde nicht rechtzeitig bereit." >&2
          docker logs graphhopper
          exit 1

      - name: Run integration tests
        run: uv run pytest -m integration -v
        env:
          GRAPHHOPPER_URL: http://localhost:8989

      - name: Stop GraphHopper
        if: always()
        run: docker rm -f graphhopper || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise-managed tools (Node.js)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm test
