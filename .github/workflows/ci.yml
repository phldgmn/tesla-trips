name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run linters (ruff check, ruff format, mypy)
        run: uv run hk check --all

      - name: Run unit tests with coverage
        run: uv run pytest -m "not integration" --cov=src/tripplanner --cov-report=term-missing --cov-fail-under=85

  integration-tests:
    runs-on: ubuntu-latest
    services:
      graphhopper:
        image: israelhikingmap/graphhopper:11.0  # offizielles Community-Image, aktuellstable Tag
        ports:
          - 8989:8989
        env:
          JETTY_BASE: /var/lib/graphhopper
          GH_LOADED_GRAPH_CACHE_DIR: /var/lib/graphhopper/cache
        options: >-
          --health-cmd "curl -f http://localhost:8989/route?point=52.52,13.40&point=52.53,13.41 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run pytest -m integration -v
        env:
          GRAPHHOPPER_URL: http://localhost:8989

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm test
