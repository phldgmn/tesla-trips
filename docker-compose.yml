services:
  graphhopper:
    image: israelhikingmap/graphhopper:11.0
    container_name: tesla-trips-graphhopper
    ports:
      - "8989:8989"
    volumes:
      # Cached Graph-Import ueberlebt Container-Neustarts (kein erneuter
      # Download/Import bei jedem `docker compose up`). Bereits via
      # `.gitignore` (`data/`) von Git ausgeschlossen.
      - ./data:/data
    # Nutzt den lokal per `scripts/prepare_osm_extract.sh` erzeugten,
    # zusammengeführten Extrakt aus vollständigem Deutschland-, Dänemark-
    # und Schweden-Datensatz (Geofabrik-Länderextrakte, per `osmium merge`
    # zusammengefügt - GraphHopper liest nur eine einzelne lokale Datei,
    # siehe README.md). `./run.sh start graphhopper`/`start backend` rufen
    # das Vorbereitungsskript bei Bedarf automatisch auf.
    command:
      - --input
      - /data/de-dk-se.osm.pbf
      - --host
      - "0.0.0.0"
    environment:
      # Kombinierter DE+DK+SE-Graph ist deutlich größer als der vorige
      # Berlin-Demo-Extrakt - mehr Heap fuer Import und Betrieb. Der
      # graphhopper.sh-Entrypoint des Images liest `JAVA_OPTS` (nicht
      # `GRAPHHOPPER_JAVA_OPTS` - das war vorher ein wirkungsloses,
      # unbenutztes Environment-Var, weil der kleine Berlin-Extrakt auch
      # mit dem Default-Heap von 1g funktionierte).
      - JAVA_OPTS=-Xms2g -Xmx8g
    restart: unless-stopped
